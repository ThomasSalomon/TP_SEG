[project]
name = "asistente-llm-vulnerable"
version = "0.1.0"
description = "Asistente de atención al cliente con LLM local, deliberadamente vulnerable, para el TPI de Seguridad en el Desarrollo de Software (UTN)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "chromadb>=0.5",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "llm: requiere el modelo real servido por Ollama (se ejecuta con `pytest -m llm`)",
]
addopts = "-m 'not llm'"
